<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Da spedire</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#16213A;--muted:#5C6678;--line:#C3CBD7;--tape:#FFC83D;--tapeink:#16213A;--vinted:#0A8F98;--walla:#3F8F2E;--altro:#6B5B95;--danger:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--card:#172036;--ink:#E8ECF4;--muted:#98A3B8;--line:#2F3A57;--danger:#FF8A80}}
:root[data-theme="dark"]{--bg:#0F1626;--card:#172036;--ink:#E8ECF4;--muted:#98A3B8;--line:#2F3A57;--danger:#FF8A80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.tag{background:var(--tape);color:var(--tapeink);font:800 22px/1 "Bricolage Grotesque",system-ui,sans-serif;padding:10px 16px 10px 22px;clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%);min-width:56px;text-align:center}
button,.btn{font:600 14px Figtree,system-ui,sans-serif;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-block}
button:focus-visible,.btn:focus-within,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--vinted);outline-offset:2px}
.primary{background:var(--ink);color:var(--bg);width:100%;padding:13px;font-size:16px}
.add{width:100%;margin-bottom:18px;padding:13px;font-size:16px;background:var(--tape);color:var(--tapeink);border-color:var(--tape)}
form{background:var(--card);border-radius:12px;padding:16px;margin-bottom:20px;display:none;gap:12px;flex-direction:column;border:1.5px dashed var(--line)}
form.open{display:flex}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
input[type=text],input[type=date],textarea,select{font:400 16px Figtree,system-ui,sans-serif;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:76px;resize:vertical}
input[type=date]{min-height:44px}
input[type=file]{font-size:14px;max-width:100%}
.hint{font-weight:400;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;gap:12px;background:var(--card);padding:14px;border-radius:12px;margin-bottom:10px;border-left:6px solid var(--vinted)}
.row[data-p="Wallapop"]{border-left-color:var(--walla)}
.row[data-p="Altro"]{border-left-color:var(--altro)}
.chk{flex:none;width:34px;height:34px;padding:0;border-width:2.5px;border-radius:8px;display:grid;place-items:center;font-size:20px;line-height:1}
.done .chk{background:var(--tape);border-color:var(--tape);color:var(--tapeink)}
.body{flex:1;min-width:0}
.plat{font-weight:600;font-size:13px;color:var(--muted)}
.title{font:800 21px/1.2 "Bricolage Grotesque",Figtree,system-ui,sans-serif;overflow-wrap:anywhere}
.desc{font-size:14px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap;margin-top:2px}
.done .title{text-decoration:line-through;color:var(--muted)}
.due{font-size:15px;margin-top:3px}.due b{font-weight:600}.due span{color:var(--muted)}
.meta{color:var(--muted);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts button,.acts .btn{padding:6px 10px;font-size:13px}
.noel{color:var(--muted);font-size:13px;align-self:center}
.del{border-color:transparent;color:var(--danger)}
.del.armed{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.edit .body{display:flex;flex-direction:column;gap:10px}
.edit .sv{background:var(--ink);color:var(--bg)}
.urgent{background:#C62828;color:#fff;border-left-color:#7F0000}
.urgent .plat,.urgent .meta,.urgent .desc,.urgent .due span,.urgent .noel{color:#FFE3E0}
.urgent button,.urgent .btn{border-color:#fff;color:#fff}
.urgent .del{border-color:transparent}
.urgent .del.armed{background:#fff;color:#C62828;border-color:#fff}
.empty{border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}
details{margin-top:26px}
summary{cursor:pointer;font:800 18px "Bricolage Grotesque",system-ui,sans-serif;margin-bottom:12px}
dialog{width:min(96vw,720px);height:88vh;border:0;border-radius:12px;padding:0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 12px}
#pages{height:calc(100% - 56px);overflow:auto;padding:0 12px 12px;background:var(--bg)}
#pages canvas{display:block;width:100%;height:auto;background:#fff;margin:0 auto 12px}
#msg{padding:24px;text-align:center;color:var(--muted)}
@media print{main{display:none}body{background:#fff}.dh{display:none}dialog{position:static;width:auto;height:auto;overflow:visible;background:#fff}#pages{height:auto;overflow:visible;padding:0;background:#fff}#pages canvas{width:100%;margin:0;page-break-after:always;break-after:page}}
.note{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
</style>
</head>
<body>
<main>
  <header><h1>Da spedire</h1><div class="tag" id="count" aria-live="polite">0</div></header>
  <button class="add" id="toggle">+ Nuova vendita</button>
  <form id="form">
    <label class="f">Titolo
      <input type="text" id="title" required placeholder="Es. Giacca Zara taglia M"></label>
    <label class="f">Spedisci entro <span class="hint">(facoltativa)</span>
      <input type="date" id="due"></label>
    <label class="f">Descrizione <span class="hint">(facoltativa)</span>
      <textarea id="desc" placeholder="Es. pacco piccolo, aggiungere un biglietto"></textarea></label>
    <label class="f">Dove
      <select id="plat"><option>Vinted</option><option>Wallapop</option><option>Altro</option></select></label>
    <label class="f">Acquirente <span class="hint">(facoltativo)</span>
      <input type="text" id="buyer" placeholder="Nome o username"></label>
    <label class="f">Etichetta PDF <span class="hint">(facoltativa, puoi aggiungerla dopo)</span>
      <input type="file" id="file" accept="application/pdf"></label>
    <button class="primary" type="submit">Salva vendita</button>
  </form>
  <ul id="todo"></ul>
  <details id="doneBox"><summary id="doneTitle">Spedite</summary><ul id="done"></ul></details>
  <p class="note">I dati restano salvati su questo dispositivo, nel browser che usi per aprire la pagina.</p>
</main>
<dialog id="dlg">
  <div class="dh"><button id="print">Stampa</button><button id="close">Chiudi</button></div>
  <div id="pages"><p id="msg">Preparo l'etichetta…</p></div>
</dialog>
<script>
var $=function(s){return document.querySelector(s)};
var db=null,mem=[],sales=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function openDB(){return new Promise(function(res){try{var r=indexedDB.open("da-spedire",1);r.onupgradeneeded=function(){r.result.createObjectStore("sales",{keyPath:"id"})};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function getAll(){return new Promise(function(res){if(!db)return res(mem.slice());try{var q=db.transaction("sales").objectStore("sales").getAll();q.onsuccess=function(){res(q.result)};q.onerror=function(){res([])}}catch(e){res([])}})}
function put(s){return new Promise(function(res){if(!db){var i=mem.findIndex(function(x){return x.id===s.id});if(i<0)mem.push(s);else mem[i]=s;return res()}try{var t=db.transaction("sales","readwrite");t.objectStore("sales").put(s);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
function del(id){return new Promise(function(res){if(!db){mem=mem.filter(function(x){return x.id!==id});return res()}try{var t=db.transaction("sales","readwrite");t.objectStore("sales").delete(id);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
function days(s){if(!s.due)return null;var p=s.due.split("-"),t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(+p[0],+p[1]-1,+p[2])-t)/864e5)}
function fdate(d){var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0].slice(2)}
function when(n){return n<0?"scaduta da "+(-n)+(n===-1?" giorno":" giorni"):n===0?"scade oggi":n===1?"scade domani":"scade tra "+n+" giorni"}
var editing=null,delArm=null;
function editRow(s){
  var opts=["Vinted","Wallapop","Altro"].map(function(x){return '<option'+(x===s.plat?' selected':'')+'>'+x+'</option>'}).join("");
  return '<li class="row edit" data-id="'+s.id+'" data-p="'+esc(s.plat)+'"><div class="body">'+
    '<label class="f">Titolo<input type="text" class="e-title" value="'+esc(s.title||s.desc)+'"></label>'+
    '<label class="f">Spedisci entro<input type="date" class="e-due" value="'+esc(s.due||"")+'"></label>'+
    '<label class="f">Descrizione<textarea class="e-desc">'+esc(s.title?s.desc:"")+'</textarea></label>'+
    '<label class="f">Dove<select class="e-plat">'+opts+'</select></label>'+
    '<label class="f">Acquirente<input type="text" class="e-buyer" value="'+esc(s.buyer||"")+'"></label>'+
    '<div class="acts"><button class="sv" data-a="save">Salva modifiche</button><button data-a="cancel">Annulla</button></div></div></li>';
}
function row(s){
  if(editing===s.id)return editRow(s);
  var title=s.title||s.desc,desc=s.title?s.desc:"",n=days(s),urgent=!s.done&&n!==null&&n<=2;
  var lab=s.label?'<button data-a="view">Apri etichetta</button>':'<span class="noel">Manca etichetta</span><label class="btn">Aggiungi PDF<input type="file" accept="application/pdf" data-id="'+s.id+'" hidden></label>';
  return '<li class="row'+(s.done?' done':'')+(urgent?' urgent':'')+'" data-id="'+s.id+'" data-p="'+esc(s.plat)+'">'+
    '<button class="chk" data-a="tick" aria-label="'+(s.done?'Segna come da spedire':'Segna come spedita')+'">'+(s.done?'✓':'')+'</button>'+
    '<div class="body"><div class="plat">'+esc(s.plat)+'</div><div class="title">'+esc(title)+'</div>'+
    (s.due?'<div class="due"><b>'+fdate(s.due)+'</b>'+(s.done?'':' <span>('+when(n)+')</span>')+'</div>':'')+
    (desc?'<div class="desc">'+esc(desc)+'</div>':'')+
    (s.buyer?'<div class="meta">Per '+esc(s.buyer)+'</div>':'')+
    '<div class="acts">'+(s.label?lab:lab)+'<button data-a="edit">Modifica</button><button class="del'+(delArm===s.id?' armed':'')+'" data-a="del">'+(delArm===s.id?'Tocca ancora per eliminare':'Elimina')+'</button></div></div></li>';
}
function render(){
  var p=sales.filter(function(s){return !s.done}).sort(function(a,b){var x=a.due||"9999",y=b.due||"9999";return x<y?-1:x>y?1:a.created-b.created});
  var d=sales.filter(function(s){return s.done}).sort(function(a,b){return b.doneAt-a.doneAt});
  $("#count").textContent=p.length;
  $("#todo").innerHTML=p.length?p.map(row).join(""):'<li class="empty">Niente da spedire. Quando vendi qualcosa, aggiungilo qui sopra.</li>';
  $("#done").innerHTML=d.map(row).join("");
  $("#doneTitle").textContent="Spedite ("+d.length+")";
  $("#doneBox").style.display=d.length?"":"none";
}
async function refresh(){sales=await getAll();render()}
$("#toggle").onclick=function(){var f=$("#form");f.classList.toggle("open");if(f.classList.contains("open"))$("#title").focus()};
$("#form").onsubmit=async function(e){
  e.preventDefault();
  var f=$("#file").files[0];
  await put({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:$("#title").value.trim(),due:$("#due").value,desc:$("#desc").value.trim(),plat:$("#plat").value,buyer:$("#buyer").value.trim(),label:f||null,labelName:f?f.name:"",done:false,created:Date.now()});
  e.target.reset();e.target.classList.remove("open");refresh();
};
document.addEventListener("click",async function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var li=b.closest(".row"),id=li.dataset.id,s=sales.find(function(x){return x.id===id});if(!s)return;
  var a=b.dataset.a;
  if(a==="tick"){s.done=!s.done;s.doneAt=Date.now();await put(s);refresh()}
  else if(a==="del"){
    if(delArm===id){delArm=null;await del(id);refresh()}
    else{delArm=id;render();setTimeout(function(){if(delArm===id){delArm=null;if(!editing)render()}},4000)}
  }
  else if(a==="view"){showLabel(s)}
  else if(a==="edit"){editing=id;render()}
  else if(a==="cancel"){editing=null;render()}
  else if(a==="save"){
    var t=li.querySelector(".e-title").value.trim();
    if(!t){li.querySelector(".e-title").focus();return}
    s.title=t;s.due=li.querySelector(".e-due").value;s.desc=li.querySelector(".e-desc").value.trim();
    s.plat=li.querySelector(".e-plat").value;s.buyer=li.querySelector(".e-buyer").value.trim();
    editing=null;await put(s);refresh();
  }
});
document.addEventListener("change",async function(e){
  var i=e.target;if(!i.matches('input[type=file][data-id]'))return;
  var s=sales.find(function(x){return x.id===i.dataset.id});
  if(s&&i.files[0]){s.label=i.files[0];s.labelName=i.files[0].name;await put(s);refresh()}
});
async function showLabel(s){
  var dl=null;
  try{if(window.claude&&claude.use)dl=await claude.use("downloads")}catch(x){}
  if(dl){
    var fn=/\.pdf$/i.test(s.labelName||"")?s.labelName:"etichetta.pdf";
    try{await dl.save({filename:fn,data:s.label});return}
    catch(x){if(x&&x.code==="declined")return}
  }
  var box=$("#pages");box.innerHTML='<p id="msg">Preparo l\'etichetta…</p>';
  if(!$("#dlg").open)$("#dlg").showModal();
  try{
    var buf=await s.label.arrayBuffer();
    var pdf=await pdfjsLib.getDocument({data:buf}).promise;
    box.innerHTML="";
    for(var n=1;n<=pdf.numPages;n++){
      var pg=await pdf.getPage(n),vp=pg.getViewport({scale:2.5}),c=document.createElement("canvas");
      c.width=vp.width;c.height=vp.height;box.appendChild(c);
      await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    }
    setTimeout(function(){try{window.print()}catch(e){}},300);
  }catch(e){box.innerHTML='<p id="msg">Non riesco a mostrare questo PDF. Prova a ricaricarlo con "Elimina" e "Aggiungi PDF".</p>'}
}
$("#print").onclick=function(){window.print()};
$("#close").onclick=function(){$("#dlg").close()};
$("#dlg").addEventListener("close",function(){$("#pages").innerHTML=""});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!editing)render()});
openDB().then(function(d){db=d;refresh()});
</script>
</body>
</html>
